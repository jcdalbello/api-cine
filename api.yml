openapi: 3.0.0
info:
  title: API de Peliculas y Salas
  description: Documentacion generada basada en tests de Supertest y codigo fuente.
  version: 1.2.0
servers:
  - url: http://localhost:3000
    description: Servidor Local

paths:
  /:
    get:
      summary: Health check
      description: Verifica que el servidor este respondiendo.
      responses:
        '200':
          description: Operacion exitosa.

  /peliculas:
    get:
      summary: Obtener lista de peliculas
      description: Devuelve un array con todas las peliculas. Permite filtrar por titulo y genero (busqueda parcial/fuzzy).
      parameters:
        - in: query
          name: titulo
          schema:
            type: string
          description: Filtra las peliculas por titulo (coincidencia parcial).
        - in: query
          name: genero
          schema:
            type: string
          description: Filtra las peliculas por genero (coincidencia parcial).
      responses:
        '200':
          description: Lista de peliculas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pelicula'
    
    post:
      summary: Crear una nueva pelicula
      description: Crea una pelicula con titulo y genero. Valida longitud (max 70) y campos obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaInput'
      responses:
        '201':
          description: Pelicula creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelicula'
        '400':
          description: Datos incorrectos (Validacion fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoPeliculaError'

  /peliculas/{id}:
    get:
      summary: Obtener una pelicula por ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID numerico de la pelicula.
      responses:
        '200':
          description: Pelicula encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelicula'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaNoEncontradaError'

  /salas:
    get:
      summary: Obtener lista de salas
      description: Devuelve un array con todas las salas. Permite filtrar por capacidad minima.
      parameters:
        - in: query
          name: capacidad
          schema:
            type: integer
          description: Filtra salas con capacidad igual o mayor a la indicada.
      responses:
        '200':
          description: Lista de salas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sala'
        '400':
          description: Error de validacion en los parametros de busqueda (ej. capacidad no numerica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'

    post:
      summary: Crear una nueva sala
      description: Crea una sala con una capacidad especifica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaInput'
      responses:
        '201':
          description: Sala creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          description: Datos incorrectos (capacidad faltante o menor/igual a 0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'

  /salas/{id}:
    get:
      summary: Obtener una sala por ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID numerico de la sala.
      responses:
        '200':
          description: Sala encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          description: ID invalido (formato no numerico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'
        '404':
          description: Sala no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaNoEncontradaError'

  /funciones:
    get:
      summary: Obtener lista de funciones
      description: Devuelve un array con todas las funciones. Permite filtrar por sala o por pelicula.
      parameters:
        - in: query
          name: idSala
          schema:
            type: integer
          description: Filtrar funciones por ID de sala.
        - in: query
          name: idPelicula
          schema:
            type: integer
          description: Filtrar funciones por ID de pelicula.
      responses:
        '200':
          description: Lista de funciones obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcion'
        '400':
          description: Error de validacion (IDs no numericos en query params).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoFuncionError'

    post:
      summary: Crear una nueva funcion
      description: Crea una funcion asignando una pelicula a una sala.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionInput'
      responses:
        '201':
          description: Funcion creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcion'
        '400':
          description: Datos incorrectos (IDs no numericos o faltantes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoFuncionError'
        '404':
          description: Sala o Pelicula no encontrada para crear la funcion.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SalaNoEncontradaError'
                  - $ref: '#/components/schemas/PeliculaNoEncontradaError'

  /funciones/{id}:
    get:
      summary: Obtener una funcion por ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID numerico de la funcion.
      responses:
        '200':
          description: Funcion encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcion'
        '400':
          description: ID invalido (formato no numerico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoFuncionError'
        '404':
          description: Funcion no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionNoEncontradaError'

components:
  schemas:
    # --- Esquemas de Pelicula ---
    Pelicula:
      type: object
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: "Terminator"
        genero:
          type: string
          example: "Accion"
    
    PeliculaInput:
      type: object
      required:
        - titulo
        - genero
      properties:
        titulo:
          type: string
          maxLength: 70
          example: "Terminator"
        genero:
          type: string
          maxLength: 70
          example: "Accion"
    
    CampoIncorrectoPeliculaError:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        genero:
          type: string
    
    PeliculaNoEncontradaError:
      type: object
      properties:
        id:
          type: string
          example: "no se encontro ninguna pelicula con el id indicado"

    # --- Esquemas de Sala ---
    Sala:
      type: object
      properties:
        id:
          type: integer
          example: 10
        capacidad:
          type: integer
          example: 50
    
    SalaInput:
      type: object
      required:
        - capacidad
      properties:
        capacidad:
          type: integer
          description: Capacidad de la sala (debe ser mayor a 0)
          example: 100

    CampoIncorrectoSalaError:
      type: object
      properties:
        id:
          type: string
        capacidad:
          type: string

    SalaNoEncontradaError:
      type: object
      properties:
        id:
          type: string
          example: "no se encontro ninguna sala con el id indicado"

    # --- Esquemas de Funcion ---
    Funcion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        idSala:
          type: integer
          example: 10
        idPelicula:
          type: integer
          example: 5
    
    FuncionInput:
      type: object
      required:
        - idSala
        - idPelicula
      properties:
        idSala:
          type: integer
          example: 1
        idPelicula:
          type: integer
          example: 1
    
    CampoIncorrectoFuncionError:
      type: object
      properties:
        id:
          type: string
        idSala:
          type: string
        idPelicula:
          type: string

    FuncionNoEncontradaError:
      type: object
      properties:
        id:
          type: string
          example: "No se encontro ninguna funcion con el id indicado"
