openapi: 3.0.0
info:
  title: API de Peliculas y Salas
  description: Documentacion generada basada en tests de Supertest
  version: 1.1.0
servers:
  - url: http://localhost:3000
    description: Servidor Local

paths:
  /:
    get:
      summary: Health check
      description: Verifica que el servidor este respondiendo.
      responses:
        '200':
          description: Operacion exitosa.

  /peliculas:
    get:
      summary: Obtener lista de peliculas
      description: Devuelve un array con todas las peliculas. Permite filtrar por titulo y genero (busqueda parcial/fuzzy).
      parameters:
        - in: query
          name: titulo
          schema:
            type: string
          description: Filtra las peliculas por titulo (coincidencia parcial).
        - in: query
          name: genero
          schema:
            type: string
          description: Filtra las peliculas por genero (coincidencia parcial).
      responses:
        '200':
          description: Lista de peliculas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pelicula'
    
    post:
      summary: Crear una nueva pelicula
      description: Crea una pelicula con titulo y genero. Valida longitud (max 70) y campos obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaInput'
      responses:
        '201':
          description: Pelicula creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelicula'
        '400':
          description: Datos incorrectos (Validacion fallida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoPeliculaError'
              examples:
                faltanDatos:
                  summary: Errores en los campos de Pelicula
                  value:
                    titulo: "El titulo es un campo obligatorio"
                    genero: "El genero es un campo obligatorio"
                excesoCaracteres:
                  summary: Exceso de caracteres
                  value:
                    titulo: "El titulo no puede superar el limite de caracteres"

  /peliculas/{id}:
    get:
      summary: Obtener una pelicula por ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID numerico de la pelicula.
      responses:
        '200':
          description: Pelicula encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelicula'
        '404':
          description: Recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaNoEncontradaError'
              example:
                id: "no se encontro ninguna pelicula con el id indicado"

  /salas:
    get:
      summary: Obtener lista de salas
      description: Devuelve un array con todas las salas. Permite filtrar por capacidad minima.
      parameters:
        - in: query
          name: capacidad
          schema:
            type: integer
          description: Filtra salas con capacidad igual o mayor a la indicada.
      responses:
        '200':
          description: Lista de salas obtenida exitosamente (puede estar vacia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sala'
        '400':
          description: Error de validacion en los parametros de busqueda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'

    post:
      summary: Crear una nueva sala
      description: Crea una sala con una capacidad especifica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaInput'
      responses:
        '201':
          description: Sala creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          description: Datos incorrectos (capacidad faltante o menor/igual a 0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'
              example:
                capacidad: "La capacidad es un campo obligatorio"

  /salas/{id}:
    get:
      summary: Obtener una sala por ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID numerico de la sala.
      responses:
        '200':
          description: Sala encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          description: ID invalido (formato no numerico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampoIncorrectoSalaError'
              example:
                id: "El id debe ser un numero valido"
        '404':
          description: Sala no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaNoEncontradaError'
              example:
                id: "no se encontro ninguna sala con el id indicado"

components:
  schemas:
    Pelicula:
      type: object
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: "pelicula1"
        genero:
          type: string
          example: "genero1"
    
    PeliculaInput:
      type: object
      required:
        - titulo
        - genero
      properties:
        titulo:
          type: string
          maxLength: 70
          example: "pelicula1"
        genero:
          type: string
          maxLength: 70
          example: "genero1"
    
    CampoIncorrectoPeliculaError:
      type: object
      properties:
        id:
          type: string
          description: Mensaje de error relacionado con el id
        titulo:
          type: string
          description: Mensaje de error relacionado con el titulo
        genero:
          type: string
          description: Mensaje de error relacionado con el genero
    
    PeliculaNoEncontradaError:
      type: object
      properties:
        id:
          type: string
          description: Mensaje explicando que el ID no existe

    Sala:
      type: object
      properties:
        id:
          type: integer
          example: 10
        capacidad:
          type: integer
          example: 50
    
    SalaInput:
      type: object
      required:
        - capacidad
      properties:
        capacidad:
          type: integer
          description: Capacidad de la sala (debe ser mayor a 0)
          example: 100

    CampoIncorrectoSalaError:
      type: object
      properties:
        id:
          type: string
          description: Mensaje de error si el ID no es numerico
        capacidad:
          type: string
          description: Mensaje de error si la capacidad es invalida o falta

    SalaNoEncontradaError:
      type: object
      properties:
        id:
          type: string
          description: Mensaje explicando que la Sala con ese ID no existe
