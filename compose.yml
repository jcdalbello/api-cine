services:
  db:
    image: postgres:15-alpine
    
    restart: always
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    ports:
      - "${DB_PORT}:${DB_PORT}"
    
    volumes:      
    # mapear el script local a la carpeta de docker
      - ./base-de-datos/init.sql:/docker-entrypoint-initdb.d/init.sql
    
    tmpfs:
      - /var/lib/postgresql/data
