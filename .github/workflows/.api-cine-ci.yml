name: API Cine CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: usuario       
      DB_PASSWORD: password
      DB_NAME: api_cine_cd

    steps:
      - uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "yarn"

      - name: docker
        run: |
          docker compose up -d
          echo "Inicializando base de datos con docker..."
          sleep 10

      - name: build.sh
        run: |
          ./build.sh
