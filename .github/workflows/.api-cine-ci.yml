name: API Cine CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: usuario
      DB_PASSWORD: password
      DB_NAME: api_cine_db

    steps:
      - uses: actions/checkout@v4

      - name: docker
        run: |
          docker compose up
          sleep 3

      - name: node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "yarn"
      - name: build.sh
        run: |
          ./build.sh
